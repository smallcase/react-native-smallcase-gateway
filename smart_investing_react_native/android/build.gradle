buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

if (System.getenv('MF_LOCAL_SDK') == '1') {
    ext.SmallcaseGateway_sdkDependency = 'com.smallcase.gateway:sdk-mf-local:0.0.0-local'
}

allprojects {
    repositories {
        if (System.getenv('MF_LOCAL_SDK') == '1') {
            maven { url rootProject.file('../build/local-sdk/android') }
        }
        google()
        mavenCentral()
        mavenLocal()
        gradlePluginPortal()
        maven { url 'https://www.jitpack.io' }
        maven { url "https://maven.google.com" }

        // smallcase gateway PROD SDKs
        maven {
            url "${artifactory_contextUrl}/SCGateway"
            content { includeGroupByRegex 'com\\.smallcase.*' }
        }

        // checkout juspay
        maven { url "https://maven.juspay.in/jp-build-packages/hyper-sdk/" }
    }
}
