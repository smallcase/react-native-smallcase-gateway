name: Preview

# Publishes the selected branch to GitHub Packages as <version>-preview.<run>. With native SDK versions as inputs
# (release or debug builds), it first commits them on a new branch preview/<ios-...>__<android-...> (from the
# selected branch), so the combination stays visible and reproducible.
on:
  workflow_dispatch:
    inputs:
      ios_scg:
        description: iOS SCGateway SPM tag (empty = branch pin)
        required: false
      ios_loans:
        description: iOS Loans SPM tag (empty = branch pin)
        required: false
      android_scg:
        description: Android SCGateway version (empty = branch pin)
        required: false
      android_loans:
        description: Android Loans version (empty = branch pin)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.CASE_CI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CASE_CI_RELEASE_APP_PRI_KEY }}
          owner: smallcase
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Commit the native versions on a preview branch
        env:
          IOS_SCG: ${{ inputs.ios_scg }}
          IOS_LOANS: ${{ inputs.ios_loans }}
          ANDROID_SCG: ${{ inputs.android_scg }}
          ANDROID_LOANS: ${{ inputs.android_loans }}
        run: |
          pins=() names=()
          for platform in ios android; do
            parts=()
            for sdk in scg loans; do
              var="${platform^^}_${sdk^^}" v=${!var}
              [ -z "$v" ] || { pins+=("$platform-$sdk=$v"); parts+=("$sdk-$v"); }
            done
            [ ${#parts[@]} -eq 0 ] || names+=("$platform-$(IFS=_; echo "${parts[*]}")")
          done
          echo "Branch \`$GITHUB_REF_NAME\` at \`$GITHUB_SHA\`." >>"$GITHUB_STEP_SUMMARY"
          [ ${#pins[@]} -gt 0 ] || exit 0

          scripts/apply-native-pins.sh "${pins[@]}" # validates every input
          branch=$(printf '%s__' "${names[@]}")
          branch="preview/${branch%__}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "chore: preview ${pins[*]}"
          git push --force origin "$branch" # same versions again: the latest run wins
          echo "Pushed \`$branch\` with ${pins[*]}." >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v6
        with:
          registry-url: https://npm.pkg.github.com
      - uses: volta-cli/action@v4
      - run: yarn install --frozen-lockfile

      - name: Publish the preview
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          base=$(node -p 'require("./package.json").version.split("-")[0]')
          scripts/publish-github-package.sh "$base-preview.$GITHUB_RUN_NUMBER" preview
