name: 🚀 Release

# On every push to main, release-please keeps the "chore(main): release X.Y.Z" PR up to date.
# Merging it tags vX.Y.Z, then: pin guard -> npm X.Y.Z (latest).
# The only npm publish; keep this file name, npm trusted publishing is bound to it.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A PR opened with GITHUB_TOKEN starts no workflows, so the release PR would get no checks.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.CASE_CI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CASE_CI_RELEASE_APP_PRI_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: main

  npm:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing (OIDC)
      contents: read
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.CASE_CI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CASE_CI_RELEASE_APP_PRI_KEY }}
          owner: smallcase
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - run: scripts/pin-guard.sh
      - uses: actions/setup-node@v6
        with:
          registry-url: https://registry.npmjs.org
      - uses: volta-cli/action@v4
      - run: yarn install --frozen-lockfile
      - run: npm publish # prepack vendors the iOS SDKs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

