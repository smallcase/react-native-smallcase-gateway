name: 🚀 Staging Release

# On every push to staging, release-please keeps the "chore: release staging" PR up to date.
# Merging that PR tags vX.Y.Z-rc.N and publishes to GitHub Packages: X.Y.Z-rc.N (release pins, dist-tag rc) and
# X.Y.Z-rc-debug.N (debug pins from native-sdk-debug.json, dist-tag rc-debug).
on:
  push:
    branches: [staging]

concurrency:
  group: staging-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A PR opened with GITHUB_TOKEN starts no workflows, so the release PR would get no checks.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.CASE_CI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CASE_CI_RELEASE_APP_PRI_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          target-branch: staging
          config-file: release-please-staging.json
          manifest-file: .release-please-manifest-staging.json

  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [release, debug]
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.CASE_CI_RELEASE_APP_ID }}
          private-key: ${{ secrets.CASE_CI_RELEASE_APP_PRI_KEY }}
          owner: smallcase
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v6
        with:
          registry-url: https://npm.pkg.github.com
      - uses: volta-cli/action@v4
      - run: yarn install --frozen-lockfile
      - name: Publish ${{ matrix.variant }}
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = release ]; then
            scripts/publish-github-package.sh "$VERSION" rc
          else
            mapfile -t pins < <(jq -r 'to_entries[] | "\(.key)=\(.value)"' native-sdk-debug.json)
            scripts/publish-github-package.sh "${VERSION/-rc./-rc-debug.}" rc-debug "${pins[@]}"
          fi
